name: One-off frontend deploy (631aaf0)

# Temporary, authorized by the owner. Builds exactly 631aaf0 and publishes the
# frontend only; no quality gate, no backend. Remove after use.
on:
  push:
    branches: [feature/m4-client-live]
    paths: [.github/workflows/oneoff-frontend-deploy.yml]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 631aaf054fd4481850507e287963c4d64f24d20c
      - run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - name: Validate deployment artifact
        run: npm run verify:dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
