name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Required quality gates (typecheck, lint, unit tests, build, Playwright E2E).
  # `build` needs this, and `deploy` needs `build`, so a failing test blocks
  # production. Defined once in ci.yml and shared with pull-request runs.
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Firebase Analytics (GA4). These are repository *variables* (Settings →
      # Secrets and variables → Actions → Variables), not secrets: a Firebase web
      # config is public by design and ends up in the shipped JS anyway. Vite
      # inlines them at build time; if any of the four is unset the app skips
      # analytics entirely (see src/app/services/analytics/analyticsConfig.ts).
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}

      # Only ./dist is ever published. This fails the deploy if source maps,
      # markdown, agent files, tests or config leaked into the output —
      # see scripts/verify-dist.mjs for the full rule set.
      - name: Validate deployment artifact
        run: npm run verify:dist

      - name: List published files
        run: find ./dist -type f | sort

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
